apiVersion: 1

providers:
  - name: Aegis
    orgId: 1
    folder: Aegis
    type: file
    disableDeletion: false
    # Picks up edits to the JSON files without a Grafana restart.
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
