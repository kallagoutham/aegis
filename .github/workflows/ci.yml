name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  # Cancel superseded runs on the same branch; only the latest commit matters.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Values the test environment needs. None are real secrets - the suite never
  # contacts a provider.
  APP_ENV: test
  JWT_SECRET_KEY: ci-secret-key-long-enough-for-hs256-signing-in-tests
  OPENAI_API_KEY: sk-ci-not-a-real-key
  LOG_TO_FILE: "false"
  LOG_LEVEL: CRITICAL
  LANGFUSE_ENABLED: "false"
  LONG_TERM_MEMORY_ENABLED: "false"

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: |
          uv venv
          uv pip install -e ".[dev,test]"

      - name: Ruff lint
        run: .venv/bin/ruff check aegis tests

      - name: Black format check
        run: .venv/bin/black --check aegis tests

      - name: isort import check
        run: .venv/bin/isort --check-only aegis tests

      - name: Flake8 lint
        run: .venv/bin/flake8 aegis tests

      - name: Type check
        # Not yet blocking: the codebase is only partially annotated, and a
        # failing gate that everyone learns to ignore is worse than none.
        run: .venv/bin/mypy aegis || true

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        # Matches the compose stack, so CI and local development agree about
        # whether pgvector exists.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: aegis_test
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: aegis_test
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis-ci

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[test]"

      - name: Create extensions
        run: |
          PGPASSWORD=aegis-ci psql -h localhost -U aegis -d aegis_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Apply migrations
        run: .venv/bin/alembic upgrade head

      - name: Run tests
        run: .venv/bin/python -m pytest --cov=aegis --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  migrations:
    name: Migrations are reversible
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: aegis_migrations
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: aegis_migrations
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis-ci

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Install
        run: |
          uv venv
          uv pip install -e ".[test]"

      - name: Create extensions
        run: |
          PGPASSWORD=aegis-ci psql -h localhost -U aegis -d aegis_migrations \
            -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Upgrade then downgrade then upgrade
        # A downgrade path nobody exercises is a downgrade path that does not
        # work, which is discovered during the rollback of a bad deploy.
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/alembic downgrade base
          .venv/bin/alembic upgrade head

      - name: Check for undeclared schema drift
        # autogenerate must produce an empty migration; anything else means a
        # model changed without a matching migration.
        run: |
          .venv/bin/alembic revision --autogenerate -m "drift-check" -_rev-id drift 2>/dev/null || true
          if grep -qE "op\.(create|drop|alter|add)_" migrations/versions/drift_*.py 2>/dev/null; then
            echo "::error::Models have changed without a migration. Run: make migration M='...'"
            cat migrations/versions/drift_*.py
            exit 1
          fi
          rm -f migrations/versions/drift_*.py

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          # Reuse the layer cache across runs; the dependency layer dominates
          # build time.
          cache-from: type=gha
          cache-to: type=gha,mode=max
