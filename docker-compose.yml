# Aegis local stack: API, PostgreSQL with pgvector, Prometheus, Grafana.
#
# Usage:
#   make up ENV=development
#   make logs
#   make down
#
# The obsolete top-level `version:` key is intentionally absent - Compose v2
# ignores it and warns.

name: aegis

x-common-env: &common-env
  APP_ENV: ${APP_ENV:-development}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-aegis}
  POSTGRES_USER: ${POSTGRES_USER:-aegis}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis-local-dev}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    # pgvector/pgvector ships the vector extension prebuilt. Plain postgres:16
    # would need it compiled in at image build time.
    image: pgvector/pgvector:pg16
    container_name: aegis-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis-local-dev}
      # Faster index builds during local ingestion experiments.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      # The app must not start migrating until postgres accepts queries, not
      # merely until the port is open.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegis} -d ${POSTGRES_DB:-aegis}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    networks: [aegis]

  api:
    build:
      context: .
      target: runtime
      args:
        APP_ENV: ${APP_ENV:-development}
    container_name: aegis-api
    env_file:
      - .env.${APP_ENV:-development}
    environment:
      <<: *common-env
      # Kubernetes/ECS capture stdout; a file would just fill the layer.
      LOG_TO_FILE: "false"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Live reload during development. Remove this mount for a production-like
      # run, where the image contents should be authoritative.
      - ./aegis:/app/aegis:ro
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/api/v1/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging
    networks: [aegis]

  prometheus:
    image: prom/prometheus:latest
    container_name: aegis-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      # Required for Grafana to reload dashboards without a restart.
      - "--web.enable-lifecycle"
    depends_on: [api]
    restart: unless-stopped
    logging: *default-logging
    networks: [aegis]

  grafana:
    image: grafana/grafana:latest
    container_name: aegis-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    restart: unless-stopped
    logging: *default-logging
    networks: [aegis]

networks:
  aegis:
    driver: bridge

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
